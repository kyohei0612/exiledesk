[package]
name = "exiledesk"
version = "0.1.17"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "exiledesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# poe2scout が Access-Control-Allow-Origin を返さないため、WebView fetch 経由ではなく
# Rust 側 fetch (CORS 不問) を提供するために http plugin を採用。
tauri-plugin-http = "2"
# Windows / macOS / Linux ログイン時の自動起動 ON/OFF (Phase 設定画面)
# 自動起動時は `--tray-only` 引数を付けて、Discord 風にバックグラウンドのみ常駐させる。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.10", features = ["luajit", "vendored"] }
# PoB share code (base64-zlib XML) decode 用
base64 = "0.22"
flate2 = "1"
# anyhow for ergonomic error handling in the Rust side until thiserror needed
anyhow = "1"
# POE2 trade2 API (CORS 制約のためブラウザ直叩き不可、Rust 側 proxy 必須)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# poe.ninja クライアント (Phase β): Semaphore で並列度制御、tokio::spawn で並列実行
# (futures::join_all は使わず、JoinHandle を手書きループで集約することで依存を最小化)
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

