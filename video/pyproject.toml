[project]
name = "poe2tube"
version = "0.1.0"
description = "PoE2 初心者向け解説動画 (ずんだもん × 四国めたん) を ExileDesk のデータから半自動生成する"
requires-python = ">=3.10"
authors = [{ name = "kyohei", email = "nekodori0612@gmail.com" }]
readme = "README.md"

dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "Pillow",
  "numpy",
  "psd-tools>=1.10",
  "requests",
  "structlog",
  "playwright>=1.45",
]

[project.optional-dependencies]
# YouTube への投稿 (publish/)。前は venv に手で入れていた (10-22 に pyproject へ)
youtube = [
  "google-api-python-client>=2",
  "google-auth>=2",
  "google-auth-oauthlib>=1",
  "httplib2",
]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.5",
  "black>=24",
  "mypy>=1.10",
  "types-requests",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["output", "cache", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["poe2tube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=poe2tube --cov-report=term-missing --cov-fail-under=70"
