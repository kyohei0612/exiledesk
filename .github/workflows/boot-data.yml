# Web 版が開いた時に読む boot.json (配信の情報 + 相場) を 1 時間おきに作り直して exiledesk-data (静的なファイル) に置く (2026-10-10)。
# 静的なファイルへの問い合わせは数えられないので、開く人が増えてもサーバーの無料枠を使わない。
# 要る secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit)。無い間は動かずに止まる (画面はサーバーの /boot.json に戻る)
name: Boot data
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency: { group: boot-data, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b824ebc2247db353f01cabcee65b567f
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts\nserver/data", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-boot.mjs
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: server/data
        run: npx --yes wrangler@4 deploy
