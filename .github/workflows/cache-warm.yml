name: Cache warm (Rust)

# Release ワークフローはタグ (refs/tags/vX.Y.Z) で走るため、そこで保存した Rust キャッシュは
# 他のタグからは見えない (GitHub Actions のキャッシュは「同じ ref か既定ブランチ」しか復元できない)。
# 実測 2026-09-12: 毎回 "Cache not found" でフルビルド (tauri-action 9 分)。
# → main への push でビルドしてキャッシュを既定ブランチ側に作る。Release は restore-keys の
#   接頭辞一致で main のキャッシュを復元し、差分だけコンパイルする。

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/cache-warm.yml"
  workflow_dispatch:

concurrency:
  group: cache-warm-main
  cancel-in-progress: true

jobs:
  warm-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Release と同じ path / key。バージョン bump 直後の Cargo.lock は main とタグで同一なので完全一致も狙える。
      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri のコード生成が frontendDist (dist/) を要求するので先にフロントを作る
      - name: Build frontend
        run: pnpm build

      - name: Build Rust (release, no bundling)
        working-directory: src-tauri
        run: cargo build --release
