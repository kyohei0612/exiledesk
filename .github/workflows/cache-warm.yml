name: Cache warm (Rust)

# Release ワークフローはタグ (refs/tags/vX.Y.Z) で走るため、そこで保存した Rust キャッシュは
# 他のタグからは見えない (GitHub Actions のキャッシュは「同じ ref か既定ブランチ」しか復元できない)。
# 実測 2026-09-12: 毎回 "Cache not found" でフルビルド (tauri-action 9 分)。
# → main への push でビルドしてキャッシュを既定ブランチ側に作る。Release は restore-keys の
#   接頭辞一致で main のキャッシュを復元し、差分だけコンパイルする。

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/cache-warm.yml"
  workflow_dispatch:

concurrency:
  group: cache-warm-main
  cancel-in-progress: true

jobs:
  warm-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Release と同じ path / key。バージョン bump 直後の Cargo.lock は main とタグで同一なので完全一致も狙える。
      # 自分のバージョン行を除いた Cargo.lock でキーを作る (2026-09-18)。
      # リリースのたびに版が上がるので、そのままだとキャッシュのキーが毎回変わり、
      # 1.1 GB のキャッシュを毎回作り直していた (保存に 52 秒 + 10 GB の枠を食って古い物が消える)。
      - name: Cache key (自分の版を除いた Cargo.lock)
        shell: bash
        # rustc の版も入れる (2026-10-03): stable が 1.98.1 → 1.99.0 に上がった後も Cargo.lock が同じでキーが変わらず、
        # 古い rustc で作ったキャッシュを毎回戻しては全部作り直していた (tauri-action 3 分 → 8 分)。キーが同じだと新しい物で上書きもされない
        run: |
          sed '/^name = "exiledesk"$/,+1 s/^version = .*/version = "x"/' src-tauri/Cargo.lock > .cargo-lock-key
          rustc -V >> .cargo-lock-key

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/release/bundle
          # v2 (2026-09-29): Cache warm をリリースと同じ tauri build で作るようにした時に、食い違った古いキャッシュを入れ替えるため
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('.cargo-lock-key') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # リリース (tauri-action = tauri build) と**同じコマンド**で作る (2026-09-29)。
      # 前は cargo build --release で、tauri build が足す本番用の機能 (custom-protocol) が無かったため
      # 「別のビルド」扱いになり、リリースのたびに tauri と tauri-plugin-* を作り直していた (約 1 分)。
      # beforeBuildCommand (pnpm build) もここで走る。--no-bundle なのでインストーラーは作らない (署名も要らない)
      - name: Build (tauri build --no-bundle, リリースと同じ)
        run: pnpm tauri build --no-bundle
