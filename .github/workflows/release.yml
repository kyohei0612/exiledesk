name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # サブモジュール (PoB 本体 + 日本語パッチ、合わせて 30 秒ぶん) は、
      # 同梱物を作り直す時だけ取りに行く (2026-09-18: 毎回 31 秒かけて取っていた)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 自分のバージョン行を除いた Cargo.lock でキーを作る (2026-09-18)。
      # リリースのたびに版が上がるので、そのままだとキャッシュのキーが毎回変わり、
      # 1.1 GB のキャッシュを毎回作り直していた (保存に 52 秒 + 10 GB の枠を食って古い物が消える)。
      - name: Cache key (自分の版を除いた Cargo.lock)
        shell: bash
        run: sed '/^name = "exiledesk"$/,+1 s/^version = .*/version = "x"/' src-tauri/Cargo.lock > .cargo-lock-key

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/release/bundle
          key: ${{ runner.os }}-cargo-${{ hashFiles('.cargo-lock-key') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # vendor の SHA + 組み立てスクリプトが前回と同じなら、PoB 同梱はまるごと飛ばす。
      # SHA は submodule の中身が無くても git ls-tree で読める
      - name: PoB 同梱の要否
        id: pob
        shell: bash
        run: |
          key=$(git ls-tree HEAD vendor | sha256sum | cut -c1-16)
          key=$key-$(sha256sum scripts/build-pob-bundle.mjs scripts/publish-pob-bundle.mjs | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: PoB 同梱の記録
        id: pob-cache
        uses: actions/cache@v4
        with:
          path: .pob-published
          key: pob-published-${{ steps.pob.outputs.key }}

      - name: Checkout submodules (PoB を作り直す時だけ)
        if: steps.pob-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive --depth 1

      - name: Build PoB bundle (vendor submodule -> src-tauri/resources/pob)
        if: steps.pob-cache.outputs.cache-hit != 'true'
        run: node scripts/build-pob-bundle.mjs

      # PoB はインストーラに同梱せず、固定タグ pob-bundle に zip + manifest として置く (内容が変わったときだけ上書き)。
      # アプリは起動時 30 日ごとに manifest を確認して app_local_data_dir/pob に展開する。
      - name: Publish PoB bundle (rolling release "pob-bundle")
        if: steps.pob-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/publish-pob-bundle.mjs
          date -u +%FT%TZ > .pob-published

      - name: Build & Release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ExileDesk ${{ github.ref_name }}"
          releaseBody: |
            ## ExileDesk ${{ github.ref_name }}

            自動更新は次回起動時に反映されます。

            初回インストール時のみ Windows SmartScreen の警告が出ますが、
            「詳細情報」→「実行」で進めてください（証明書なし配布のため）。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
