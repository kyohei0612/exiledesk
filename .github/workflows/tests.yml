name: Tests

# 自動テスト (2026-09-29 オーナー「テストは開発版に置こうか」→ 案 B: リリースとは別に走らせて、落ちたら知らせるだけ)。
# main への push ごとに、画面側のテスト (pnpm test = vitest、tests/) と Rust のテスト (cargo test) を走らせる。
# 落ちると GitHub から push した人にメールが届く。リリース (release.yml) は止めない。
# テストが育ったら release.yml の前に needs で挟んで「落ちたらリリースも止める」(案 A) に切り替える。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: tests-main
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 画面側のテスト (vitest)
        run: pnpm test

      # テスト用の Rust のキャッシュはリリース用 (release プロファイル) と別。版の行を除いた Cargo.lock でキーを作る
      - name: Cache key (自分の版を除いた Cargo.lock)
        shell: bash
        run: sed '/^name = "exiledesk"$/,+1 s/^version = .*/version = "x"/' src-tauri/Cargo.lock > .cargo-lock-key

      - name: Cache Rust (test)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-v1-${{ hashFiles('.cargo-lock-key') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-v1-

      # tauri のコード生成が dist/ を要るので先にフロントを作る (型チェックもここで走る)
      - name: Build frontend
        run: pnpm build

      - name: Rust のテスト (cargo test)
        working-directory: src-tauri
        run: cargo test
