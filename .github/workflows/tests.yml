name: Tests

# 自動テスト (2026-09-29 オーナー「テストは開発版に置こうか」)。画面側のテストは release.yml でも走り、落ちたらリリースを止める (案 A)。
# main への push ごとに、画面側のテスト (pnpm test = vitest、tests/) と Rust のテスト (cargo test) を走らせる。
# 落ちると GitHub から push した人にメールが届く。Rust のテストは時間がかかるのでリリースは待たない (こちらだけで回す)。

on:
  push:
    branches: [main]
    # 動画 (video/、Python) だけの commit では回さない
    paths-ignore: ["video/**"]
  workflow_dispatch: {}

# 前の実行を取り消さない (取り消すと初回の Rust のキャッシュ作りが途中で止まり、毎回ゼロから作り直すことになる)
concurrency:
  group: tests-main
  cancel-in-progress: false

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 画面側のテスト (vitest)
        run: pnpm test --exclude "tests/held-odds-all/**" --exclude "tests/currency-spec-*"

      # ADR-004 の新旧の打ち比べ (重い) も別の段でワーカー 2 つまで (2026-10-16、上と同じ理由)
      - name: カレンシーの新旧の打ち比べ (vitest)
        run: pnpm vitest run tests/currency-spec --maxWorkers=2 --minWorkers=1

      # 確率表の総当たり (重い) は別の段で、ワーカーを 2 つまでに。全部いっぺんに回すと CI の小さい機械で親の返事が詰まり、
      # vitest の「Timeout calling onTaskUpdate」で落ちていた (テスト自体は全部通っていた。2026-10-11)
      - name: 確率表の総当たり (vitest)
        run: pnpm vitest run tests/held-odds-all --maxWorkers=2 --minWorkers=1

      # テスト用の Rust のキャッシュはリリース用 (release プロファイル) と別。版の行を除いた Cargo.lock でキーを作る
      - name: Cache key (自分の版を除いた Cargo.lock)
        shell: bash
        # rustc の版も入れる (release.yml と同じ。2026-10-03: stable が上がっても古いキャッシュを戻して全部作り直していた)
        run: |
          sed '/^name = "exiledesk"$/,+1 s/^version = .*/version = "x"/' src-tauri/Cargo.lock > .cargo-lock-key
          rustc -V >> .cargo-lock-key

      - name: Cache Rust (test)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-v1-${{ hashFiles('.cargo-lock-key') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-v1-

      # tauri のコード生成が dist/ を要るので先にフロントを作る (型チェックもここで走る)
      - name: Build frontend
        run: pnpm build

      - name: Rust のテスト (cargo test)
        working-directory: src-tauri
        run: cargo test
