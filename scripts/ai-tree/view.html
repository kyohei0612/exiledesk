<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AI 自動ツリー</title>
<style>
:root{--bg:#14110d;--box:#221c15;--line:#5c4c36;--text:#e8dcc6;--dim:#a39477;--go:#c9a35b;--ok:#6fbf73;--ng:#d9705f}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "Yu Gothic UI","Meiryo",sans-serif}
nav{position:sticky;top:0;left:0;z-index:2;display:flex;gap:12px;align-items:center;padding:8px 16px;background:#1b1610;border-bottom:1px solid var(--line)}
select{background:var(--box);color:var(--text);border:1px solid var(--line);padding:3px 6px;max-width:520px}
#head{color:var(--dim)}
#tree{position:relative}svg{position:absolute;inset:0;pointer-events:none}
path{fill:none;pointer-events:stroke}.go{stroke:var(--go)}.back{stroke:var(--line);stroke-dasharray:6 5}
.box{position:absolute;box-sizing:border-box;background:var(--box);border:1px solid var(--line);border-radius:6px;padding:6px 10px;overflow:hidden}
.box h2{font-size:14px;margin:0 0 6px}.box h2 i{font-style:normal;color:var(--dim);font-weight:400;float:right}
.rule{height:40px;overflow:hidden;white-space:nowrap}.rule b{font-weight:600}.rule i{font-style:normal;color:var(--go)}.rule span{display:block;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.end{border-width:2px}.done{border-color:var(--ok);color:var(--ok)}.stuck,.limit{border-color:var(--ng);color:var(--ng)}
</style>
</head>
<body>
<nav><b>AI 自動ツリー</b><select id="run"></select><span id="head"></span></nav>
<div id="tree"></div>
<script type="module">
import { renderTree } from "./lib/view.mjs";
import { headOf } from "./lib/report.mjs";

const pick = document.querySelector("#run"), tree = document.querySelector("#tree"), head = document.querySelector("#head");
let rows = [], seen = "";
const show = () => {
  const row = rows.find((x) => x.id === pick.value);
  if (!row) { tree.textContent = "まだ記録がありません"; return; }
  head.textContent = `${headOf(row.result)} / ${row.people} 人・種 ${row.seed}。数字と × は 1 人あたりの回数`;
  tree.innerHTML = row.graph ? renderTree(row) : "この記録には木がありません";
};
async function load() {
  const text = await (await fetch("/data-cache/ai-tree/log.jsonl", { cache: "no-store" })).text().catch(() => "");
  if (text === seen) return;
  seen = text;
  const had = pick.value, follow = !had || had === rows.at(-1)?.id;
  rows = text.split("\n").filter((l) => l.startsWith("{")).map((l) => JSON.parse(l));
  pick.innerHTML = rows.map((x) => `<option value="${x.id}">${x.id} ${x.recipeName}</option>`).reverse().join("");
  pick.value = follow ? rows.at(-1)?.id ?? "" : had;
  show();
}
pick.onchange = show;
load();
setInterval(load, 3000);
</script>
</body>
</html>
