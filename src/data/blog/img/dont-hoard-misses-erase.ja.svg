<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262" role="img" font-family='"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif'>
<title>サフィックスに狙い 1 つと外れ 2 つなら消去で狙いが消える確率は 1/3、狙い 1 つと外れ 1 つなら 1/2。B は消去 135 個・やり直し 35 回、C は消去 57 個・やり直し 25 回</title>
<rect width="560" height="262" rx="8" fill="#17130e"/>
<text x="20" y="30" font-size="17" fill="#e8dfcf" text-anchor="start" font-weight="700">消去 1 回で狙いが消える確率</text><text x="20" y="74" font-size="15" fill="#e8dfcf" text-anchor="start" font-weight="700">B 溜めてから消す</text><rect x="170" y="52" width="84" height="34" rx="6" fill="#e0b062"/><text x="212" y="75" font-size="14" fill="#17130e" text-anchor="middle" font-weight="700">狙い</text><rect x="262" y="52" width="84" height="34" rx="6" fill="#c9694f"/><text x="304" y="75" font-size="14" fill="#17130e" text-anchor="middle" font-weight="700">外れ</text><rect x="354" y="52" width="84" height="34" rx="6" fill="#c9694f"/><text x="396" y="75" font-size="14" fill="#17130e" text-anchor="middle" font-weight="700">外れ</text><text x="536" y="78" font-size="26" fill="#e0b062" text-anchor="end" font-weight="700">1/3</text><text x="170" y="108" font-size="13" fill="#a99b84" text-anchor="start" font-weight="400">1 回あたりは低いが、消す回数が多い</text><text x="170" y="128" font-size="13" fill="#e8dfcf" text-anchor="start" font-weight="400">消去 135 個・やり直し 35 回</text><rect x="20" y="148" width="520" height="2" fill="#3a3024"/><text x="20" y="188" font-size="15" fill="#e8dfcf" text-anchor="start" font-weight="700">C すぐ消す</text><rect x="170" y="166" width="84" height="34" rx="6" fill="#e0b062"/><text x="212" y="189" font-size="14" fill="#17130e" text-anchor="middle" font-weight="700">狙い</text><rect x="262" y="166" width="84" height="34" rx="6" fill="#c9694f"/><text x="304" y="189" font-size="14" fill="#17130e" text-anchor="middle" font-weight="700">外れ</text><rect x="354" y="166" width="84" height="34" rx="6" fill="#3a3024"/><text x="536" y="192" font-size="26" fill="#e0b062" text-anchor="end" font-weight="700">1/2</text><text x="170" y="222" font-size="13" fill="#a99b84" text-anchor="start" font-weight="400">1 回あたりは高いが、消す回数が少ない</text><text x="170" y="242" font-size="13" fill="#e8dfcf" text-anchor="start" font-weight="400">消去 57 個・やり直し 25 回</text>
</svg>
