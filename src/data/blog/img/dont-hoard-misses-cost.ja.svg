<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 226" width="560" height="226" role="img" font-family='"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif'>
<title>1 個あたりの費用: A 441 神、B 400 神、C 220 神。C の打ち方で狙いを単体耐性 T1 に替えると 111 神</title>
<rect width="560" height="226" rx="8" fill="#faf7f0"/>
<text x="20" y="30" font-size="17" fill="#2b2620" text-anchor="start" font-weight="700">1 個あたりの費用 (神のオーブ)</text><text x="20" y="52" font-size="13" fill="#6b6255" text-anchor="start" font-weight="400">エンジンで 300 人ずつ打った平均。細い線は ±10% の幅</text><text x="20" y="84" font-size="15" fill="#6b6255" text-anchor="start" font-weight="400">A レアリティだけカオス</text><path d="M210,70H444.14Q448.14,70 448.14,74V84Q448.14,88 444.14,88H210Z" fill="#a89b85"/><path d="M424.326,79H471.954M424.326,74V84M471.954,74V84" stroke="#2b2620" stroke-opacity=".55" stroke-width="1.5" fill="none"/><text x="479.954" y="84" font-size="15" fill="#2b2620" text-anchor="start" font-weight="400">441 神</text><text x="20" y="118" font-size="15" fill="#6b6255" text-anchor="start" font-weight="400">B 3 つまで埋める</text><path d="M210,104H422Q426,104 426,108V118Q426,122 422,122H210Z" fill="#a89b85"/><path d="M404.4,113H447.6M404.4,108V118M447.6,108V118" stroke="#2b2620" stroke-opacity=".55" stroke-width="1.5" fill="none"/><text x="455.6" y="118" font-size="15" fill="#2b2620" text-anchor="start" font-weight="400">400 神</text><text x="20" y="152" font-size="15" fill="#2b2620" text-anchor="start" font-weight="700">C 外れはすぐ消去</text><path d="M210,138H324.8Q328.8,138 328.8,142V152Q328.8,156 324.8,156H210Z" fill="#b97d12"/><path d="M316.92,147H340.68M316.92,142V152M340.68,142V152" stroke="#2b2620" stroke-opacity=".55" stroke-width="1.5" fill="none"/><text x="348.68" y="152" font-size="15" fill="#94650c" text-anchor="start" font-weight="700">220 神</text><rect x="20" y="177" width="520" height="2" fill="#e4ddd0"/><text x="20" y="200" font-size="15" fill="#2b2620" text-anchor="start" font-weight="700">C で狙いを単体耐性 T1 に</text><path d="M210,186H265.94Q269.94,186 269.94,190V200Q269.94,204 265.94,204H210Z" fill="#b97d12"/><path d="M263.946,195H275.934M263.946,190V200M275.934,190V200" stroke="#2b2620" stroke-opacity=".55" stroke-width="1.5" fill="none"/><text x="283.934" y="200" font-size="15" fill="#94650c" text-anchor="start" font-weight="700">111 神</text>
</svg>
