<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262" role="img" font-family='"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif'>
<title>With one target and two misses in the suffixes, an Annulment hits the target 1 in 3; with one target and one miss, 1 in 2. B used 135 Annulments and restarted 35 times; C used 57 and restarted 25 times</title>
<rect width="560" height="262" rx="8" fill="#faf7f0"/>
<text x="20" y="30" font-size="17" fill="#2b2620" text-anchor="start" font-weight="700">Chance one Annulment hits the target</text><text x="20" y="74" font-size="15" fill="#2b2620" text-anchor="start" font-weight="700">B Annul later</text><rect x="170" y="52" width="84" height="34" rx="6" fill="#b97d12"/><text x="212" y="75" font-size="14" fill="#2b2620" text-anchor="middle" font-weight="700">Target</text><rect x="262" y="52" width="84" height="34" rx="6" fill="#c4553b"/><text x="304" y="75" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Miss</text><rect x="354" y="52" width="84" height="34" rx="6" fill="#c4553b"/><text x="396" y="75" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Miss</text><text x="536" y="78" font-size="26" fill="#94650c" text-anchor="end" font-weight="700">1/3</text><text x="170" y="108" font-size="13" fill="#6b6255" text-anchor="start" font-weight="400">Lower per Annulment, but many more of them</text><text x="170" y="128" font-size="13" fill="#2b2620" text-anchor="start" font-weight="400">135 Annulments · 35 restarts</text><rect x="20" y="148" width="520" height="2" fill="#e4ddd0"/><text x="20" y="188" font-size="15" fill="#2b2620" text-anchor="start" font-weight="700">C Annul at once</text><rect x="170" y="166" width="84" height="34" rx="6" fill="#b97d12"/><text x="212" y="189" font-size="14" fill="#2b2620" text-anchor="middle" font-weight="700">Target</text><rect x="262" y="166" width="84" height="34" rx="6" fill="#c4553b"/><text x="304" y="189" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Miss</text><rect x="354" y="166" width="84" height="34" rx="6" fill="#e4ddd0"/><text x="536" y="192" font-size="26" fill="#94650c" text-anchor="end" font-weight="700">1/2</text><text x="170" y="222" font-size="13" fill="#6b6255" text-anchor="start" font-weight="400">Higher per Annulment, but far fewer</text><text x="170" y="242" font-size="13" fill="#2b2620" text-anchor="start" font-weight="400">57 Annulments · 25 restarts</text>
</svg>
