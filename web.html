    <meta charset="UTF-8" />
    <!--
      旧 URL (web.exiledesk.workers.dev) から独自ドメイン (exiledesk.com) へ (2026-10-11)。
      localStorage はドメインごとで、そのまま飛ばすと作業中のアイテム・レシピ・記録しない印などが消えて見えるので、
      中身を URL の # に乗せて持っていき、新しい方で「まだ無い物だけ」入れる。# はサーバーに送られない。大きすぎる時は飛ばさず旧 URL のまま
    -->
    <script>
      (function () {
        var NEW = "exiledesk.com";
        var host = location.hostname;
        try {
          if (host === "web.exiledesk.workers.dev") {
            var all = {};
            for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k) all[k] = localStorage.getItem(k); }
            var bytes = new TextEncoder().encode(JSON.stringify(all)), bin = "";
            for (var j = 0; j < bytes.length; j += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(j, j + 8192));
            var enc = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
            var dest = "https://" + NEW + location.pathname + location.search;
            if (!Object.keys(all).length) location.replace(dest + location.hash);
            else if (enc.length < 1500000) location.replace(dest + "#migrate=" + enc);
            return;
          }
          if (host === NEW || host === "www." + NEW) {
            var m = /^#migrate=([A-Za-z0-9_-]+)$/.exec(location.hash);
            if (m) {
              var raw = atob(m[1].replace(/-/g, "+").replace(/_/g, "/")), u8 = new Uint8Array(raw.length);
              for (var x = 0; x < raw.length; x++) u8[x] = raw.charCodeAt(x);
              var got = JSON.parse(new TextDecoder().decode(u8));
              for (var key in got) if (localStorage.getItem(key) === null) localStorage.setItem(key, got[key]);
              history.replaceState(null, "", location.pathname + location.search);
            }
          }
        } catch (e) { /* 持っていけなくても開く */ }
      })();
    </script>

  <body>
    <!--
      最初の画面 (2026-10-19 スマホ強化: JS を読んで動かすまで 5 秒ほど真っ白で、来た人が帰っていた)。HTML だけでその場で出し、Vue が動くと #app の中身ごと差し替わる。
      言語は src/i18n/lang.ts と同じ決め方 (?lang= → 覚えた物 exiledesk.lang → ブラウザの言語)。CSS は JS の後に来るので全部ここに書く
    -->
    <div id="app">
      <div id="boot-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#0b0a08;color:#d8cdb5;font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;text-align:center">
        <img src="/web/icon-192.png" alt="" width="72" height="72" style="width:72px;height:72px" />
        <div style="font-family:Georgia,serif;font-size:26px;letter-spacing:0.18em;color:#f0cf86">EXILEDESK</div>
        <div data-ja="Path of Exile 2 のクラフトを、タダで 1 手ずつ試せるエミュレーター" data-en="Try Path of Exile 2 crafting one step at a time, for free" style="font-size:14px;max-width:22rem;line-height:1.6"></div>
        <div data-ja="カレンシー・お告げ・エッセンス・冒涜をゲームと同じ決まりで" data-en="Currency, omens, essences and desecration with the same rules as the game" style="font-size:12px;color:#8f856f;max-width:22rem;line-height:1.6"></div>
        <div data-ja="読み込み中…" data-en="Loading…" style="margin-top:10px;font-size:12px;color:#a99d86;letter-spacing:0.1em"></div>
      </div>
      <script>
        (function () {
          var en = false;
          try {
            var q = new URLSearchParams(location.search).get("lang");
            var v = q === "ja" || q === "en" ? q : localStorage.getItem("exiledesk.lang");
            en = v ? v === "en" : !/^ja\b/i.test(navigator.language || "");
          } catch (e) { /* 日本語のまま */ }
          var els = document.querySelectorAll("#boot-splash [data-ja]");
          for (var i = 0; i < els.length; i++) els[i].textContent = els[i].getAttribute(en ? "data-en" : "data-ja");
        })();
      </script>
    </div>
    <!-- Web 版の入口 (2026-10-07)。アプリ版は index.html / src/main.ts -->
    <script type="module" src="/src/web/main.ts"></script>
